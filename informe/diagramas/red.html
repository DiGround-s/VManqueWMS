<!doctype html>
<html lang="es"><head><meta charset="utf-8"><style>
body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#fff;color:#1d2330}
.wrap{width:1400px;padding:28px;box-sizing:border-box}
h1{font-size:26px;margin:0 0 4px}.sub{color:#5b6475;margin:0 0 20px;font-size:16px}
svg text{font-family:Segoe UI,Arial,sans-serif}
</style></head><body><div class="wrap">
<h1>Red segmentada de la bodega</h1><p class="sub">pfSense separa tres VLAN. Cada flecha es un flujo permitido; todo lo demás se bloquea (regla final «denegar todo»).</p>
<svg width="1344" height="760" viewBox="0 0 1344 760">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0L10,5L0,10z" fill="#1f7a4d"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0L10,5L0,10z" fill="#c0392b"/></marker>
</defs>
<!-- Internet + WAN -->
<rect x="572" y="10" width="200" height="56" rx="28" fill="#eef1f6" stroke="#9aa3b2"/><text x="672" y="45" text-anchor="middle" font-size="18" font-weight="600">Internet</text>
<line x1="672" y1="66" x2="672" y2="116" stroke="#5b6475" stroke-width="3"/>
<text x="684" y="98" font-size="14" fill="#5b6475">WAN (NAT)</text>
<!-- pfSense -->
<rect x="472" y="116" width="400" height="92" rx="12" fill="#1d2330"/>
<text x="672" y="152" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">pfSense</text>
<text x="672" y="180" text-anchor="middle" font-size="15" fill="#cfd5df">gateway + firewall · un gateway por VLAN (.1)</text>
<text x="672" y="200" text-anchor="middle" font-size="13" fill="#9aa3b2">LAN en modo trunk 802.1Q → switch administrable</text>
<!-- trunks -->
<line x1="560" y1="208" x2="230" y2="290" stroke="#5b6475" stroke-width="3"/>
<line x1="672" y1="208" x2="672" y2="290" stroke="#5b6475" stroke-width="3"/>
<line x1="784" y1="208" x2="1114" y2="290" stroke="#5b6475" stroke-width="3"/>
<!-- VLAN 10 -->
<rect x="20" y="290" width="420" height="300" rx="14" fill="#eaf2ff" stroke="#3b6fd8" stroke-width="2"/>
<text x="40" y="324" font-size="19" font-weight="700" fill="#24489a">VLAN 10 · Servidores y oficina</text>
<text x="40" y="348" font-size="15" fill="#24489a">192.168.10.0/24 · GW 192.168.10.1</text>
<rect x="40" y="368" width="380" height="132" rx="10" fill="#fff" stroke="#3b6fd8"/>
<text x="56" y="394" font-size="16" font-weight="700">Servidor Ubuntu 192.168.10.10</text>
<text x="56" y="420" font-size="14">• Web VManque WMS (HTTPS 443)</text>
<text x="56" y="442" font-size="14">• PostgreSQL 5432 (sólo local)</text>
<text x="56" y="464" font-size="14">• Broker MQTT Mosquitto 1883</text>
<text x="56" y="486" font-size="14">• SSH 22 (sólo desde oficina)</text>
<rect x="40" y="514" width="380" height="58" rx="10" fill="#fff" stroke="#3b6fd8"/>
<text x="56" y="540" font-size="16" font-weight="700">PC de oficina (DHCP .100–.199)</text>
<text x="56" y="560" font-size="14">supervisores y administradores</text>
<!-- VLAN 20 -->
<rect x="462" y="290" width="420" height="300" rx="14" fill="#fff6e6" stroke="#d98a1c" stroke-width="2"/>
<text x="482" y="324" font-size="19" font-weight="700" fill="#8a5300">VLAN 20 · Bodega Wi-Fi</text>
<text x="482" y="348" font-size="15" fill="#8a5300">192.168.20.0/24 · GW 192.168.20.1</text>
<rect x="482" y="368" width="380" height="96" rx="10" fill="#fff" stroke="#d98a1c"/>
<text x="498" y="394" font-size="16" font-weight="700">Teléfonos de operadores</text>
<text x="498" y="420" font-size="14">SSID «VManque-Bodega» WPA2</text>
<text x="498" y="442" font-size="14">modo bodega /m · lector de códigos</text>
<text x="482" y="500" font-size="14" fill="#8a5300">Sólo llegan a la web (443).</text>
<text x="482" y="522" font-size="14" fill="#8a5300">No ven la base de datos, el broker</text>
<text x="482" y="544" font-size="14" fill="#8a5300">ni a otros equipos de la oficina.</text>
<!-- VLAN 30 -->
<rect x="904" y="290" width="420" height="300" rx="14" fill="#eaf7ef" stroke="#1f7a4d" stroke-width="2"/>
<text x="924" y="324" font-size="19" font-weight="700" fill="#145236">VLAN 30 · IoT (pick-to-light)</text>
<text x="924" y="348" font-size="15" fill="#145236">192.168.30.0/24 · GW 192.168.30.1</text>
<rect x="924" y="368" width="380" height="96" rx="10" fill="#fff" stroke="#1f7a4d"/>
<text x="940" y="394" font-size="16" font-weight="700">ESP32 esp32-bc-01 · 192.168.30.40</text>
<text x="940" y="420" font-size="14">SSID «VManque-IoT» WPA2 · IP reservada</text>
<text x="940" y="442" font-size="14">3 tiras WS2812B (A-01, A-02, B-01)</text>
<text x="924" y="500" font-size="14" fill="#145236">Sólo puede abrir MQTT 1883 hacia</text>
<text x="924" y="522" font-size="14" fill="#145236">192.168.10.10. Sin Internet, sin acceso</text>
<text x="924" y="544" font-size="14" fill="#145236">a oficina ni a la bodega Wi-Fi.</text>
<!-- flows -->
<path d="M672,590 C672,660 330,660 300,600" fill="none" stroke="#1f7a4d" stroke-width="3" marker-end="url(#a)"/>
<text x="560" y="676" font-size="14" fill="#1f7a4d" font-weight="600">① Teléfono → servidor: HTTPS 443</text>
<path d="M1114,590 C1114,720 300,730 180,600" fill="none" stroke="#1f7a4d" stroke-width="3" marker-end="url(#a)"/>
<text x="740" y="726" font-size="14" fill="#1f7a4d" font-weight="600">② ESP32 → broker: MQTT TCP 1883 (usuario y clave)</text>
<path d="M1000,592 L800,592" fill="none" stroke="#c0392b" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#r)"/>
<text x="800" y="616" font-size="13" fill="#c0392b" font-weight="600">✕ IoT → bodega bloqueado</text>
<path d="M1250,290 L860,208" fill="none" stroke="#c0392b" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#r)"/>
<text x="1080" y="232" font-size="13" fill="#c0392b" font-weight="600">✕ IoT → Internet bloqueado</text>
</svg></div></body></html>
